<title>IT・配信 英単語帳</title>
<script>

const INITIAL_WORDS = [
  [1, "IT", "access", "アクセス、利用する／アクセス権", "Access is denied for this file.", "このファイルへのアクセスは拒否されました。", "「アクセス」と同じ。対象に近づく・利用できる状態になるイメージ。"],
  [2, "IT", "grant", "付与する、与える、許可する", "Grant administrator rights to proceed.", "続行するには管理者権限を付与してください。", "権限や機会などを相手に与えるイメージ。"],
  [3, "IT", "default", "既定値、初期設定", "Reset all settings to default.", "すべての設定を既定値に戻してください。", "「標準として設定されている状態」。スポーツの「不戦敗」という意味とは別なので注意。"],
  [4, "IT", "prompt", "指示、入力を促す表示・メッセージ", "Enter your password at the prompt.", "プロンプトでパスワードを入力してください。", "コマンドプロンプトの prompt。「入力を促す表示」。動詞では「促す」（例：When prompted, enter…＝求められたら入力して）。"],
  [5, "IT", "restrict", "制限する", "Network access is restricted.", "ネットワークへのアクセスが制限されています。", "Strict（厳しい）状態にして制限をかけること。"],
  [6, "IT", "suspend", "一時停止する", "Your account has been suspended.", "アカウントが一時停止されました。", "sus（下に）＋pend（ぶら下げる）＝宙にぶら下げて止める。サスペンション、サスペンスも同じ語源。"],
  [6, "IT", "override", "上書きする、優先する", "System settings will override user preferences.", "システム設定がユーザー設定より優先されます。", "Over（上に）Ride（乗る）で上書きして無効化する。"],
  [7, "IT", "resolve", "解決する", "Restarting the PC will resolve the issue.", "PCの再起動で問題が解決します。", "re（再び）＋solve（解く）。もつれた問題を解いて片付けるイメージ。"],
  [8, "IT", "apply", "適用する", "Click OK to apply the changes.", "OKをクリックして変更を適用してください。", "アプリ（アプリケーション）の語源。当てはめるイメージ。"],
  [9, "IT", "temporary", "一時的な", "Delete temporary files to save space.", "容量を空けるため一時ファイルを削除します。", "Temp（テンプ）ファイルのこと。時間を限定した一時物。"],
  [10, "IT", "exceed", "超える", "File size exceeds the maximum limit.", "ファイルサイズが最大制限を超えています。", "ex（外へ）＋ceed（進む）＝枠の外へ出る。proceed（前へ進む）、succeed と同じ -ceed。Excel（エクセル）とは別語源なので注意。"],
  [11, "IT", "exemption", "免除、適用除外", "Add this program to the firewall exemption list.", "このプログラムをファイアウォールの除外リストに追加してください。", "exception（例外）と関連する語。exemption は義務・規則などの免除や適用除外を表す。"],
  [12, "IT", "retrieve", "取得する、取り戻す", "Failed to retrieve user data.", "ユーザーデータの取得に失敗しました。", "レトリバー犬が獲物を取りに行って戻ってくるイメージ（retrieve が語源）。データを「復元する」は文脈によって restore がより適切。"],
  [13, "IT", "execute", "実行する", "Execute the file as administrator.", "管理者としてファイルを実行します。", "エグゼクティブ（実行役員）や.exeファイル（実行ファイル）の語源。"],
  [14, "IT", "allocate", "割り当てる", "Not enough memory allocated to this app.", "このアプリに割り当てられたメモリが不足しています。", "メモリや時間などの資源を、用途ごとに割り当てるイメージ。"],
  [15, "IT", "conflict", "衝突、競合", "An IP address conflict was detected.", "IPアドレスの競合が検出されました。", "コンフリクト。複数の設定がぶつかり合うこと。"],
  [16, "IT", "modify", "変更する", "Do you want to modify this setting?", "この設定を変更しますか？", "モッド（MOD）の語源「modify（変更・改造する）」。"],
  [17, "IT", "destination", "目的地、送信先、保存先", "Select the destination folder.", "保存先のフォルダを選択してください。", "destination は「行き先・目的地」。ファイル操作では「保存先」や「出力先」にもなる。"],
  [18, "IT", "initialize", "初期化する", "Initializing the device, please wait.", "デバイスを初期化中です。お待ちください。", "イニシャル（頭文字・最初）の状態に戻すこと。"],
  [19, "IT", "bypassed", "回避された、スキップされた", "Security check was bypassed.", "セキュリティチェックが回避されました。", "バイパス道路のように、チェックを迂回して通り抜けること。"],
  [20, "配信ゲーム", "nerf", "弱体化する", "This character got nerfed in the patch.", "このキャラはアプデで弱体化された。", "おもちゃの柔らかい銃（NERF）のように威力を弱くすること。"],
  [21, "配信ゲーム", "buff", "強化する", "The damage was buffed in the update.", "アップデートでダメージが増加した。", "能力や性能を高めること。ゲームではキャラクターや武器などの「強化」を指す。"],
  [22, "配信ゲーム", "carry", "チームを勝利に導く", "He carried the team to victory.", "彼がチームをキャリーして勝利に導いた。", "チームを背負って運ぶ（キャリーする）イメージ。"],
  [23, "配信ゲーム", "spawn", "出現する、スポーンする", "Enemies spawn behind the building.", "敵が建物の後ろに出現する。", "モンスターがスポーン（発生）する。"],
  [24, "配信ゲーム", "cooldown", "クールダウン、再使用待ち時間", "My ultimate is still on cooldown.", "ウルトがまだクールダウン中です。", "冷まして次に使えるようになるまでの待ち時間。"],
  [25, "配信ゲーム", "stealth", "ステルス、隠密", "Use stealth to pass the guards.", "ステルスを使って警備兵に見つからずに通り抜けよう。", "ステルス戦闘機のように、見つからないように行動するイメージ。"],
  [26, "配信ゲーム", "toxic", "有害な、攻撃的な、迷惑な（言動をする）", "That player was so toxic in chat.", "あのプレイヤーはチャットでかなり攻撃的な発言をしていた。", "「毒のある」が基本イメージ。オンラインでは暴言や嫌がらせをする言動にも使う。"],
  [27, "配信ゲーム", "dodge", "かわす、回避する", "I dodged the attack just in time.", "間一髪で攻撃を回避した。", "ドッジボールの dodge（よける）と同じ。"],
  [28, "配信ゲーム", "loot", "戦利品を集める、漁る", "Let us loot this house first.", "まずこの家を漁ろう。", "ルート（戦利品・ドロップアイテム）を拾うこと。"],
  [29, "配信ゲーム", "smurf", "初心者狩りをする", "That's definitely a smurf account.", "あれは絶対にスマーフ用のアカウントだ。", "本来の実力より低いランク帯でプレイするために作った別アカウントを指すことが多い。そうした行為を smurfing と呼ぶ。青いキャラ「スマーフ」が語源という説が有力。"],
  [30, "配信ゲーム", "tilt", "イライラしてプレイが雑になる", "Don't get tilted after losing.", "負けた後にティルト（イライラ）しないで。", "ピンボール台を傾ける（ティルト）ことからキレる状態。"],
  [31, "配信ゲーム", "flank", "側面から攻撃する、裏取りする", "They are flanking us from the left.", "敵が左側から裏取りしてきている。", "敵の側面に回り込んで攻撃するイメージ。ゲームでは「裏取り」もよく使われる訳。"],
  [32, "配信ゲーム", "inting", "わざと不利になる行為をする（意図的なフィード）", "Stop inting and stay safe.", "わざと突っ込んで倒されるのはやめて、安全に立ち回ろう。", "intentional feeding（意図的に敵へキルなどを与える行為）に由来するゲーム用語。使われ方はゲームによって異なる。"],
  [33, "配信ゲーム", "feed", "敵に倒されて、相手を有利にしてしまう", "Please do not feed the enemy assassin.", "敵のアサシンにキルを与えないで。", "餌（feed）を与えるように、敵へキルや経験値などを与えて有利にしてしまうイメージ。"],
  [34, "配信ゲーム", "taunt", "煽る、挑発する", "The boss will taunt you first.", "ボスが最初に煽ってくるよ。", "ゲーム内の挑発エモートなどのこと。"],
  [35, "配信日常", "gotta", "〜しなければならない（have got to）", "I gotta go now, see you later.", "もう行かなきゃ、またね！", "got to の口語形（ガタ）。日常配信でよく使う。"],
  [36, "配信日常", "kind of", "なんか、ちょっと（kinda）", "It's kind of weird today.", "今日はなんか変だね。", "「ちょっと」「なんとなく」「ある程度」。会話では kinda と短く発音・表記されることもある。"],
  [37, "配信日常", "wholesome", "心温まる、健全な、ほほえましい", "That was such a wholesome moment.", "今のはすごく心が温まるシーンだったね。", "心が温まるような、安心できる雰囲気を表す。Whole + Health という語源説明ではなく、意味と使われ方で覚えよう。"],
  [38, "配信日常", "cringe", "ドン引きする、痛々しい", "His joke was so cringe.", "彼のジョークはすごくドン引きだった。", "身縮み（クリンジ）するような恥ずかしさ。"],
  [39, "配信日常", "cap", "嘘、ハッタリ", "No cap, that was amazing.", "嘘偽りなく、今のはすごかった。", "cap はスラングで「嘘・ハッタリ」。No cap は「嘘じゃなく」「マジで」という意味。"],
  [40, "配信日常", "vibes", "雰囲気、ノリ", "Good vibes in the chat today.", "今日のチャットは雰囲気がいいね。", "バイブス（気分の高まりやその場のノリ）。"],
  [41, "配信日常", "scam", "詐欺、騙し", "This game is a total scam.", "このゲーム、完全に詐欺じゃん。", "scam は「詐欺・詐欺的なもの」。単に「クソゲー」という意味とは限らず、金銭や宣伝などで騙されたというニュアンスがある。"],
  [42, "配信日常", "legit", "マジで本物の、ガチな", "That clip was legit crazy.", "あのクリップはガチでヤバかった。", "Legitimate（合法な・本物の）の略（レジット）。"],
  [43, "配信日常", "shoutout", "称賛・感謝を込めた紹介、言及", "Big shoutout to my supporters.", "応援してくれているみんなに感謝を伝えたい！", "配信などで人の名前を挙げて、感謝や称賛を伝えること。"],
  [44, "配信日常", "hyped", "テンションが上がっている", "I am so hyped for this stream.", "この配信すごくワクワクしてる！", "Hype（ハイプ）の形容詞形。"],
  [45, "配信日常", "banned", "BANされた、禁止された", "He got banned from Twitch.", "彼はTwitchでBANされた。", "バン（BAN・禁止）。配信でのアカウント停止。"],
  [46, "配信日常", "baffled", "困惑した、当惑した", "I am totally baffled by this.", "これには完全に困惑してるよ。", "何かが理解できず、どう反応すればよいか分からない状態。baffling は「困惑させるような」。"],
  [47, "配信日常", "sus", "怪しい（suspicious）", "Red is acting very sus.", "赤のプレイヤー、かなり怪しい動きをしている。", "suspicious（怪しい）の略。Among Us などのゲームやオンライン会話で使われる。"],
  [48, "配信日常", "slaps", "（曲や食事が）最高、ヤバい", "This background music slaps.", "このBGMまじで最高だな。", "平手打ち（Slap）されるくらい衝撃的に最高なこと。"],

/* Layout: 1画面完結のスマホアプリ。上に集計と絞り込み、中央にカード、下に親指で押せる操作と下部タブ。 */
:root{
  --bg:#EBEFF7; --surface:#FFFFFF; --surface2:#F3F5FB; --ink:#141A2E; --muted:#58627F; --line:#D6DCEB;
  --accent:#3150E8; --on-accent:#FFFFFF;
  --ok:#127A55; --on-ok:#FFFFFF; --ng:#B4323B; --ng-bg:#FBE4E5;
  --it:#1F5FD6; --it-bg:#E1EBFD; --game:#B4510C; --game-bg:#FCE9D8; --life:#B02A6A; --life-bg:#FADFEC;
  --mark:#FFE58A; --mark-ink:#141A2E;
  --c3:#12714F; --c3-bg:#DDF3E9; --c4:#6B3FC4; --c4-bg:#EBE3FA; --c5:#0A7486; --c5-bg:#D9F0F4; --c6:#8A6A00; --c6-bg:#FBF0C9; --c7:#4A5575; --c7-bg:#E4E8F2;
  --shadow:0 1px 2px rgba(20,26,46,.06),0 10px 28px rgba(20,26,46,.09);
  --font-body:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
  --font-word:"Bricolage Grotesque","Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B101F; --surface:#161E34; --surface2:#1C2640; --ink:#E9EDF9; --muted:#9BA6C6; --line:#2B3656;
    --accent:#8AA2FF; --on-accent:#0B101F;
    --ok:#4FD6A0; --on-ok:#06231A; --ng:#FF9096; --ng-bg:#43191D;
    --it:#8DB8FF; --it-bg:#15294D; --game:#FFAA6E; --game-bg:#452812; --life:#FF93C1; --life-bg:#451A31;
    --mark:#5B4A12; --mark-ink:#FFEBAE;
    --c3:#6FE0AE; --c3-bg:#123A2B; --c4:#B9A0FF; --c4-bg:#2B1F52; --c5:#6ED6EA; --c5-bg:#0F3540; --c6:#F0CB5C; --c6-bg:#42350A; --c7:#B4BFDD; --c7-bg:#262F48;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B101F; --surface:#161E34; --surface2:#1C2640; --ink:#E9EDF9; --muted:#9BA6C6; --line:#2B3656;
  --accent:#8AA2FF; --on-accent:#0B101F;
  --ok:#4FD6A0; --on-ok:#06231A; --ng:#FF9096; --ng-bg:#43191D;
  --it:#8DB8FF; --it-bg:#15294D; --game:#FFAA6E; --game-bg:#452812; --life:#FF93C1; --life-bg:#451A31;
  --mark:#5B4A12; --mark-ink:#FFEBAE;
    --c3:#6FE0AE; --c3-bg:#123A2B; --c4:#B9A0FF; --c4-bg:#2B1F52; --c5:#6ED6EA; --c5-bg:#0F3540; --c6:#F0CB5C; --c6-bg:#42350A; --c7:#B4BFDD; --c7-bg:#262F48;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.top{padding:12px 16px 6px;display:flex;flex-direction:column;gap:8px}
.top h1{margin:0;font-family:var(--font-word);font-weight:800;font-size:1.15rem;letter-spacing:.01em;line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;min-width:0}
.stat small{font-size:.72rem;color:var(--muted);line-height:1.3}
.stat b{font-family:var(--font-word);font-size:1.25rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:.8rem;color:var(--muted);font-weight:600}

.filters{display:flex;flex-direction:column;gap:8px;padding:6px 16px 8px}
.filters .review{align-self:flex-start}
.catrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.catrow::-webkit-scrollbar{display:none}
.chipbtn{flex:none;white-space:nowrap;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chipbtn.review{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.chipbtn.review[aria-pressed="true"]{border-style:solid;color:var(--on-accent)}

main{flex:1;min-height:0;display:flex;flex-direction:column}
main>section{flex:1;min-height:0;display:flex;flex-direction:column;padding-inline:16px}
main>section[hidden]{display:none}

/* study */
.prog{display:flex;align-items:center;gap:12px;padding:2px 0 10px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.card-wrap{flex:1;min-height:260px;perspective:1400px}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1);cursor:pointer;border-radius:22px;animation:enter .22s ease-out}
.card.flipped{transform:rotateY(180deg)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.back{transform:rotateY(180deg)}
.facetop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.facetop .sp{flex:1}
.chip{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.chip.c0{background:var(--it-bg);color:var(--it)}
.chip.c1{background:var(--game-bg);color:var(--game)}
.chip.c2{background:var(--life-bg);color:var(--life)}
.chip.c3{background:var(--c3-bg);color:var(--c3)}
.chip.c4{background:var(--c4-bg);color:var(--c4)}
.chip.c5{background:var(--c5-bg);color:var(--c5)}
.chip.c6{background:var(--c6-bg);color:var(--c6)}
.chip.c7{background:var(--c7-bg);color:var(--c7)}
.chip.retry{background:var(--ng-bg);color:var(--ng)}
.no{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{display:inline-flex;gap:3px;align-items:flex-end}
.meter i{width:5px;height:12px;border-radius:2px;background:var(--line)}
.meter i:nth-child(1){height:8px}.meter i:nth-child(2){height:10px}.meter i:nth-child(4){height:14px}.meter i:nth-child(5){height:16px}
.meter i.on{background:var(--accent)}
.front .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0}
.word{font-family:var(--font-word);font-weight:800;font-size:clamp(2.4rem,13vw,3.7rem);line-height:1.08;margin:0;overflow-wrap:anywhere;letter-spacing:-.01em}
.ex{margin:0;font-size:1.12rem;line-height:1.6;font-weight:500}
mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.hint{font-size:.78rem;color:var(--muted);text-align:center}
.back .wsmall{font-family:var(--font-word);font-weight:800;font-size:1.3rem;color:var(--muted);margin:0}
.meaning{margin:0;font-size:1.45rem;line-height:1.35;font-weight:700;overflow-wrap:anywhere}
.blk{display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid var(--line)}
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.blk p{margin:0;font-size:.98rem;line-height:1.7}
.blk .en{color:var(--muted);font-size:.9rem}
.actions{padding:12px 0 10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:84px}
.btn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:1rem;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--ng);border-color:var(--ng)}
.btn.danger.armed{background:var(--ng);color:var(--on-accent)}
.btn.big{min-height:68px;flex-direction:column;border-radius:18px}
.btn.big small{font-size:.74rem;font-weight:500;opacity:.85;line-height:1.2;min-height:1em}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn.ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.actions .wide{grid-column:1/-1}
.btn.armed{outline:3px solid var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.panel h2{margin:0;font-size:1.3rem;line-height:1.3}
.panel p{margin:0;color:var(--muted)}
.panel .row{display:flex;flex-wrap:wrap;gap:8px}
.missed{display:flex;flex-wrap:wrap;gap:6px}
.missed span{background:var(--ng-bg);color:var(--ng);font-weight:700;font-family:var(--font-word);padding:2px 10px;border-radius:8px;font-size:.9rem}
.scroll{overflow:auto;min-height:0;flex:1;padding-block:4px 16px}
.stack{display:flex;flex-direction:column;gap:12px}

/* list */
.tools{display:flex;gap:8px;padding-bottom:8px}
.tools input{flex:1;min-width:0}
input[type=text],input[type=search],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1.5}
textarea{resize:vertical}
input.num{width:84px;flex:none;text-align:center}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.mixrow{display:flex;align-items:center;gap:8px}
.mixrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mixrow .nm .chip{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mixrow .nm small{font-size:.74rem;color:var(--muted)}
.btn.small{min-height:44px;padding:0 12px;font-size:.88rem;flex:none}
.count{margin:0 0 8px;font-size:.82rem;color:var(--muted)}

.wrow .ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--on-accent);font-size:15px;font-weight:800;line-height:1}
.wrow.sel{border-color:var(--accent);background:var(--surface2)}
.wrow.sel .ck{background:var(--accent);border-color:var(--accent)}

/* data */
.data .panel{align-items:stretch}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.tab{border:0;background:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.74rem;font-weight:700;color:var(--muted)}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}

@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
'use strict';
// 分類は自由に増やせる。最初に入っている単語の分類と、新しい単語の出題割合の初期値。
var DEFAULT_CATS=['IT','配信ゲーム','配信日常'];
var DEFAULT_MIX={'IT':6,'配信ゲーム':2,'配信日常':2};
var DEFAULT_PER_SESSION=10;
var NCOLORS=8; // 分類の色の数（c0〜c7）。分類が多いと色は繰り返す。
// 箱ごとの次回までの日数。箱1は「次のセッション」でもう一度出る。
var INTERVALS={1:0,2:1,3:3,4:7,5:14};
var KEY='itgame-eitango.v1';
var root=document.documentElement;
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var fmt=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var today=function(){return fmt(new Date())};
function addDays(s,n){var p=s.split('-').map(Number);return fmt(new Date(p[0],p[1]-1,p[2]+n))}
function dayDiff(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5)}

/* ---------- データの読み書き ---------- */
var storageOk=true;
function defaultPrefs(){return {cat:'all',review:false,theme:'auto',mix:Object.assign({},DEFAULT_MIX),perSession:DEFAULT_PER_SESSION}}
function cleanCat(s){return String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,30)}
function cleanMix(m){
  var out={};
  if(m&&typeof m==='object') Object.keys(m).forEach(function(k){var v=parseInt(m[k],10),c=cleanCat(k);if(c&&v>=0&&v<=99) out[c]=v});
  return out;
}
function cleanPer(n){n=parseInt(n,10);return n>=1&&n<=50?n:DEFAULT_PER_SESSION}
// 分類の一覧（色の順番を保つため、保存済みの並びを優先し、使われていない分類は外す）
function normCats(words,cats){
  var used=Object.create(null),out=[];
  words.forEach(function(w){used[w.cat]=1});
  function add(c){c=cleanCat(c);if(c&&used[c]&&out.indexOf(c)<0) out.push(c)}
  if(Array.isArray(cats)) cats.forEach(add);
  words.forEach(function(w){add(w.cat)});
  return out;
}
function seed(){return INITIAL_WORDS.map(function(r,i){return {no:i+1,cat:r[1],word:r[2],meaning:r[3],ex:r[4],exJa:r[5],mnemo:r[6],box:0,due:'',seen:0,ok:0,ng:0}})}
function cleanWords(arr){
  if(!Array.isArray(arr)) return [];
  var used={},out=[],max=0;
  arr.forEach(function(w){if(w&&parseInt(w.no,10)>max) max=parseInt(w.no,10)});
  arr.forEach(function(w){
    if(!w||typeof w!=='object') return;
    var word=String(w.word==null?'':w.word).trim(),meaning=String(w.meaning==null?'':w.meaning).trim();
    var cat=cleanCat(w.cat);
    if(!word||!meaning||!cat) return;
    var no=parseInt(w.no,10); if(!(no>0)||used[no]) no=++max; used[no]=1;
    var box=parseInt(w.box,10); if(!(box>=0&&box<=5)) box=0;
    var due=/^\d{4}-\d{2}-\d{2}$/.test(w.due)?w.due:''; if(box>=1&&!due) due=today(); if(box===0) due='';
    out.push({no:no,cat:cat,word:word,meaning:meaning,ex:String(w.ex==null?'':w.ex),exJa:String(w.exJa==null?'':w.exJa),mnemo:String(w.mnemo==null?'':w.mnemo),box:box,due:due,seen:+w.seen||0,ok:+w.ok||0,ng:+w.ng||0});
  });
  out.sort(function(a,b){return a.no-b.no});
  return out;
}
function loadState(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw),ws=cleanWords(o.words);if(ws.length) return fixState({words:ws,cats:o.cats,prefs:Object.assign(defaultPrefs(),o.prefs||{})})}
  }catch(e){storageOk=false}
  return fixState({words:seed(),cats:DEFAULT_CATS.slice(),prefs:defaultPrefs()});
}
function fixState(st){
  st.cats=normCats(st.words,st.cats);
  st.prefs.mix=cleanMix(st.prefs.mix);
  st.prefs.perSession=cleanPer(st.prefs.perSession);
  return st;
}
var state=loadState();
var prefs=state.prefs;
function persist(){
  state.cats=normCats(state.words,state.cats);
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOk=false}
}
function byNo(no){for(var i=0;i<state.words.length;i++) if(state.words[i].no===no) return state.words[i];return null}
function nextNo(){var m=0;state.words.forEach(function(w){if(w.no>m)m=w.no});return m+1}
function filtered(){return state.words.filter(function(w){return prefs.cat==='all'||w.cat===prefs.cat})}
function isDue(w,t){return w.box>=1&&w.due<=t}
// 単語が1語以上ある分類だけを、色の順番どおりに返す
function catList(){return normCats(state.words,state.cats)}
function catClass(c){var i=state.cats.indexOf(c);return 'c'+(i<0?NCOLORS-1:i%NCOLORS)}
function weightOf(c){return Object.prototype.hasOwnProperty.call(prefs.mix,c)?prefs.mix[c]:1}
// 入力された分類名を整える。大文字小文字だけ違う既存の分類があれば、そちらに合わせる
function resolveCat(s){
  var c=cleanCat(s);if(!c) return '';
  var low=c.toLowerCase(),all=state.cats;
  for(var i=0;i<all.length;i++) if(all[i].toLowerCase()===low) return all[i];
  return c;
}

/* ---------- セッション（間隔反復） ---------- */
var ui={view:'study',session:null,forceAll:false};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
// 新しい単語は、分類ごとの割合（prefs.mix）に比例して選ぶ。
// 1語ずつ「割合に対して選ばれた数がいちばん少ない分類」から取る。
// ある分類の未学習が足りなくなったら、残りの分類で埋める。0の分類は選ばない。
// 分類で絞り込んでいるときは、その分類だけから選ぶ。
function pickFresh(ws){
  var pool=ws.filter(function(w){return w.box===0}).sort(function(a,b){return a.no-b.no});
  var single=prefs.cat!=='all',byCat=Object.create(null),cats=[];
  pool.forEach(function(w){if(!byCat[w.cat]){byCat[w.cat]=[];cats.push(w.cat)}byCat[w.cat].push(w)});
  cats=cats.filter(function(c){return single||weightOf(c)>0});
  var cnt=Object.create(null),picked=[];
  cats.forEach(function(c){cnt[c]=0});
  while(picked.length<prefs.perSession){
    var best=null,bs=0,bw=0;
    cats.forEach(function(c){
      if(cnt[c]>=byCat[c].length) return;
      var wt=single?1:weightOf(c),sc=(cnt[c]+1)/wt;
      if(best===null||sc<bs-1e-9||(Math.abs(sc-bs)<=1e-9&&wt>bw)){best=c;bs=sc;bw=wt}
    });
    if(best===null) break;
    picked.push(byCat[best][cnt[best]++]);
  }
  return shuffle(picked);
}
function startSession(){
  var t=today(),ws=filtered(),mode=ui.forceAll?'all':(prefs.review?'review':'today'),base;
  if(mode==='all'){
    base=shuffle(ws.slice()).sort(function(a,b){return a.box-b.box});
  }else{
    var due=ws.filter(function(w){return isDue(w,t)}).sort(function(a,b){return a.box-b.box||a.due.localeCompare(b.due)||a.no-b.no});
    var fresh=mode==='review'?[]:pickFresh(ws);
    base=due.concat(fresh);
  }
  var q=base.map(function(w){return {no:w.no,retry:false}});
  ui.session={queue:q,i:0,total:base.length,done:0,ok:0,ng:0,missed:[],flipped:false,revealed:false,mode:mode};
}
function grade(ok){
  var s=ui.session;if(!s||s.i>=s.queue.length||!s.revealed) return;
  var item=s.queue[s.i],w=byNo(item.no);
  if(w){
    if(!item.retry){
      w.seen++;
      if(ok){w.ok++;w.box=w.box===0?2:Math.min(5,w.box+1);w.due=addDays(today(),INTERVALS[w.box]);s.ok++}
      else{w.ng++;w.box=1;w.due=today();s.ng++;if(s.missed.indexOf(w.no)<0)s.missed.push(w.no)}
      s.done++;
    }
    // 同じセッション内の再挑戦で思い出せたら、今日はもう出さず、明日あらためて復習する
    else if(ok&&w.box===1) w.due=addDays(today(),1);
    if(!ok) s.queue.splice(Math.min(s.i+4,s.queue.length),0,{no:w.no,retry:true});
  }
  s.i++;s.flipped=false;s.revealed=false;
  persist();renderHeader();renderStudy();
}
function flip(){
  var s=ui.session;if(!s||s.i>=s.queue.length) return;
  s.flipped=!s.flipped;if(s.flipped) s.revealed=true;
  var c=$('#card');if(c){c.classList.toggle('flipped',s.flipped);c.setAttribute('aria-pressed',String(s.flipped))}
  var f=document.querySelector('.face.front'),b=document.querySelector('.face.back');
  if(f)f.setAttribute('aria-hidden',String(s.flipped));if(b)b.setAttribute('aria-hidden',String(!s.flipped));
  $('#actions').innerHTML=actionsHtml(s);
}

/* ---------- 表示 ---------- */
function hl(ex,word){
  var safe=esc(ex),w=String(word).trim();
  for(var len=w.length;len>=Math.max(3,w.length-3);len--){
    var stem=w.slice(0,len).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s+');
    var re=new RegExp('\\b'+stem+'[a-z]*','i');
    if(re.test(safe)) return safe.replace(re,function(m){return '<mark>'+m+'</mark>'});
  }
  return safe;
}
function meter(box){
  var h='<span class="meter" role="img" aria-label="'+(box?'箱'+box+'/5':'未学習')+'">';
  for(var i=1;i<=5;i++) h+='<i class="'+(i<=box?'on':'')+'"></i>';
  return h+'</span>';
}
function chip(cat){return '<span class="chip '+catClass(cat)+'">'+esc(cat)+'</span>'}
function applyTheme(){if(prefs.theme==='light'||prefs.theme==='dark') root.setAttribute('data-theme',prefs.theme);else root.removeAttribute('data-theme')}
function renderHeader(){
  var ws=filtered(),t=today();
  var due=ws.filter(function(w){return isDue(w,t)}).length,fresh=ws.filter(function(w){return w.box===0}).length,mast=ws.filter(function(w){return w.box===5}).length;
  $('#stats').innerHTML='<div class="stat"><small>今日の復習</small><b>'+due+'<em> 語</em></b></div><div class="stat"><small>未学習</small><b>'+fresh+'<em> 語</em></b></div><div class="stat"><small>箱5（定着）</small><b>'+mast+'<em> / '+ws.length+'</em></b></div>';
}
function renderFilters(){
  var f=$('#filters');f.hidden=ui.view==='data';
  var h='<div class="catrow">'+[['all','すべて']].concat(catList().map(function(c){return [c,c]})).map(function(p){
    return '<button type="button" class="chipbtn" data-act="cat" data-v="'+esc(p[0])+'" aria-pressed="'+(prefs.cat===p[0])+'">'+esc(p[1])+'</button>';
  }).join('')+'</div>';
  if(ui.view==='study') h+='<button type="button" class="chipbtn review" data-act="review" aria-pressed="'+prefs.review+'">今日の復習だけ</button>';
  f.innerHTML=h;
}
function actionsHtml(s){
  if(!s.revealed) return '<button class="btn primary big wide" data-act="flip" type="button">答えを見る</button>';
  var item=s.queue[s.i],w=byNo(item.no),sub='';
  if(!item.retry&&w){var nb=w.box===0?2:Math.min(5,w.box+1),d=INTERVALS[nb];sub=d+'日後に復習'}
  else if(item.retry) sub='明日もう一度復習';
  return '<button class="btn ng big" data-act="ng" type="button"><span>思い出せなかった</span><small>もう一度出します</small></button>'+
         '<button class="btn ok big" data-act="ok" type="button"><span>思い出せた</span><small>'+sub+'</small></button>';
}
function nextDueText(){
  var t=today(),ws=filtered().filter(function(w){return w.box>=1&&w.due>t});
  if(!ws.length) return '';
  var min=ws.reduce(function(m,w){return w.due<m?w.due:m},ws[0].due),n=ws.filter(function(w){return w.due===min}).length,d=dayDiff(t,min);
  return '次の復習は'+(d===1?'明日':d+'日後')+'（'+n+'語）です。';
}
function renderStudy(){
  var box=$('#v-study');
  if(!ui.session) startSession();
  var s=ui.session;
  if(s.queue.length===0){
    var msg=prefs.review?'今日の復習はありません。':'今日のカードはすべて終わりました。';
    box.innerHTML='<div class="scroll"><div class="panel"><h2>'+msg+'</h2><p>'+esc(nextDueText())+'</p><div class="row">'+
      '<button class="btn primary" data-act="all" type="button">全単語を練習する</button>'+
      (prefs.review?'<button class="btn" data-act="review" type="button">新しい単語も出す</button>':'')+'</div></div></div>';
    return;
  }
  if(s.i>=s.queue.length){
    var missed=s.missed.map(byNo).filter(Boolean).map(function(w){return '<span>'+esc(w.word)+'</span>'}).join('');
    box.innerHTML='<div class="scroll"><div class="panel"><h2>セッション完了</h2><p>思い出せた '+s.ok+' 語 ／ 思い出せなかった '+s.ng+' 語</p>'+
      (missed?'<div><p style="margin-bottom:6px">次のセッションで多めに出る単語</p><div class="missed">'+missed+'</div></div>':'')+
      '<div class="row"><button class="btn primary" data-act="next" type="button">次のセッションへ</button>'+(ui.forceAll?'<button class="btn" data-act="today" type="button">今日の分に戻る</button>':'')+'</div></div></div>';
    return;
  }
  var item=s.queue[s.i],w=byNo(item.no);
  var pct=s.total?Math.min(100,Math.round(s.done/s.total*100)):0;
  box.innerHTML=
   '<div class="prog"><div class="bar"><i style="width:'+pct+'%"></i></div><span>残り '+(s.queue.length-s.i)+' 枚</span></div>'+
   '<div class="card-wrap"><div class="card'+(s.flipped?' flipped':'')+'" id="card" role="button" tabindex="0" aria-pressed="'+s.flipped+'" aria-label="カード。タップで裏返す" data-act="flip">'+
    '<div class="face front" aria-hidden="'+s.flipped+'"><div class="facetop">'+chip(w.cat)+(item.retry?'<span class="chip retry">もう一度</span>':'')+'<span class="sp"></span><span class="no">No.'+w.no+'</span>'+meter(w.box)+'</div>'+

function parseNos(text){
  var s=String(text).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)})
    .replace(/\s*[-~〜～ーｰ−–—]\s*/g,'-'),out=[],bad=[];
  s.split(/[,\s、，]+/).forEach(function(tok){
    if(!tok) return;
    var m=/^(\d+)-(\d+)$/.exec(tok);
    if(m){var a=+m[1],b=+m[2];if(a>b){var t=a;a=b;b=t}if(b-a>5000){bad.push(tok);return}for(var i=a;i<=b;i++) out.push(i)}
    else if(/^\d+$/.test(tok)) out.push(+tok);
    else bad.push(tok);
  });
  return {nos:out,bad:bad};
}

/* ---------- 一括追加 ---------- */
var JA=/[\u3040-\u30ff\u3400-\u9fff\uff00-\uffef]/;
function splitCsv(line){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"'&&cur.trim()===''){q=true;cur=''}
    else if(c===','){out.push(cur);cur=''}
    else cur+=c;
  }
  out.push(cur);
  return out.map(function(s){return s.trim()});
}
function normFields(f){
  if(f.length<6) return null;
  if(f.length===6) return f.concat(['']);
  if(f.length===7) return f;
  // 例文に半角カンマが含まれる場合: 日本語を含む最初の欄を「例文の訳」とみなす
  var i=4,ex=[];
  while(i<f.length&&!JA.test(f[i])){ex.push(f[i]);i++}
  if(i>=f.length) return null;
  return f.slice(0,4).concat([ex.join(', '),f[i],f.slice(i+1).join(',')]);
}
function openBulk(){
  openSheet('<h2>一括追加</h2><p class="note" style="margin:0;color:var(--muted);font-size:.88rem">1行に1語、「No.,分類,単語,意味,例文,例文の訳,覚え方」の順で貼り付けます。タブ区切り（表計算からのコピー）も使えます。同じ分類・同じ単語は内容を更新し（進捗は残ります）、ない単語は追加します。No.は自動で1から振り直すので、空欄でも構いません。分類は自由な名前を付けられ、まだない名前は新しい分類として自動で追加されます。</p>'+
   '<button class="btn" type="button" data-act="pickfile">Excel / CSVファイルを選ぶ</button><input id="bulkfile" type="file" hidden>'+
   '<p class="note" style="margin:0;color:var(--muted);font-size:.82rem">Excelは「No.」で始まる見出し行の次の行から、A〜G列を読みます。</p>'+
   '<label>貼り付け<textarea id="bulkta" rows="8" placeholder="103,配信日常,clutch,土壇場の活躍,He pulled off a clutch win.,彼が土壇場で勝利をもぎ取った。,クラッチ（ペダル）をつなぐように決定的な場面で決める" autocapitalize="none" spellcheck="false"></textarea></label>'+
   '<p class="msg" id="bulkmsg" role="status"></p><div class="sheet-actions"><button class="btn primary" type="button" data-act="bulkrun">取り込む</button><button class="btn" type="button" data-act="close">閉じる</button></div>');

function runBulk(){
  var items=[];
  $('#bulkta').value.split(/\r?\n/).forEach(function(raw,idx){
    if(!raw.trim()) return;
    items.push({n:idx+1,f:raw.indexOf('\t')>=0?raw.split('\t').map(function(s){return s.trim()}):splitCsv(raw)});
  });
  importRows(items);
}
// 分類＋単語（大文字小文字は区別しない）で既存の単語を探す
function findByKey(cat,word){
  var k=(cat+'\u0001'+word).toLowerCase();
  for(var i=0;i<state.words.length;i++){
    var w=state.words[i];
    if((w.cat+'\u0001'+w.word).toLowerCase()===k) return w;
  }
  return null;
}
// items: [{n:行番号, f:[No.,分類,単語,意味,例文,例文の訳,覚え方]}]
function importRows(items){
  var add=0,upd=0,errs=[],before=state.cats.slice();
  items.forEach(function(it){
    var idx=it.n-1,f=it.f.map(function(c){return String(c==null?'':c).trim()});
    if(!f.join('')) return;
    f=normFields(f);
    if(!f){errs.push((idx+1)+'行目: 項目が足りません');return}
    if(/^no\.?$/i.test(f[0])) return;
    var cat=resolveCat(f[1]);
    if(!cat){errs.push((idx+1)+'行目: 分類が空です');return}
    if(!f[2]||!f[3]){errs.push((idx+1)+'行目: 単語か意味が空です');return}
    var rec={cat:cat,word:f[2],meaning:f[3],ex:f[4],exJa:f[5],mnemo:f[6]},cur=findByKey(cat,f[2]);
    if(cur){Object.assign(cur,rec);upd++}
    else{state.words.push(Object.assign({no:nextNo(),box:0,due:'',seen:0,ok:0,ng:0},rec));add++}
    // 同じ取り込みの中で、大文字小文字だけ違う分類名が別々にならないようにする
    if(state.cats.indexOf(cat)<0) state.cats.push(cat);
  });
  state.words.sort(function(a,b){return a.no-b.no});
  state.words.forEach(function(w,i){w.no=i+1});
  var m=$('#bulkmsg');
  if(add||upd){persist();resetSession();renderAll()}
  var made=state.cats.filter(function(c){return before.indexOf(c)<0});
  var text='追加 '+add+' 件、更新 '+upd+' 件。'+(made.length?' 新しい分類: '+made.join('、')+'。':'')+(errs.length?' 取り込めなかった行: '+errs.slice(0,5).join(' ／ ')+(errs.length>5?' ほか':''):'');
  if(!errs.length&&(add||upd)){closeSheet();toast(text);return}
  m=$('#bulkmsg');m.textContent=add||upd||errs.length?text:'取り込む行がありません。';m.className='msg '+(errs.length?'bad':'good');
}

/* ---------- ファイルから取り込み（xlsx / csv） ---------- */
var XLSX_URL='xlsx.full.min.js',xlsxP=null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve();
  if(!xlsxP) xlsxP=new Promise(function(res,rej){
    var s=document.createElement('script');s.src=XLSX_URL;
    s.onload=function(){window.XLSX?res():rej()};s.onerror=function(){xlsxP=null;rej()};
    document.head.appendChild(s);
  });
  return xlsxP;
}
function fileMsg(t,bad){var m=$('#bulkmsg');if(m){m.textContent=t;m.className='msg '+(bad?'bad':'good')}}
function decodeText(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){}
  try{return new TextDecoder('shift_jis').decode(buf)}catch(e){}
  return new TextDecoder().decode(buf);
}
function sheetItems(buf){
  var wb=XLSX.read(buf,{type:'array'}),best=null;
  for(var s=0;s<wb.SheetNames.length&&!best;s++){
    var ws=wb.Sheets[wb.SheetNames[s]];if(!ws||!ws['!ref']) continue;
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:true}),r0=XLSX.utils.decode_range(ws['!ref']).s.r;
    for(var i=0;i<rows.length;i++){
      if(/^no\.?$/i.test(String(rows[i][0]).trim())){best={rows:rows,start:i+1,r0:r0};break}
    }
  }
  if(!best) return null;
  return best.rows.slice(best.start).map(function(r,k){return {n:best.r0+best.start+k+1,f:r.slice(0,7)}});
}
function readFile(file){
  if(!file) return;
  var isX=/\.xlsx?$/i.test(file.name);
  if(!isX&&!/\.(csv|tsv|txt)$/i.test(file.name)){fileMsg('Excel（.xlsx）かCSVのファイルを選んでください。',true);return}
  fileMsg(file.name+' を読み込み中…');
  var fr=new FileReader();
  fr.onerror=function(){fileMsg('ファイルを読めませんでした。',true)};
  fr.onload=function(){
    var buf=fr.result;
    if(!isX){$('#bulkta').value=decodeText(buf);fileMsg('');runBulk();return}
    loadXlsx().then(function(){
      var items=sheetItems(buf);
      if(!items){fileMsg('「No.」で始まる見出し行が見つかりませんでした。1行目か見出し行の左端を「No.」にしてください。',true);return}
      importRows(items);
    },function(){fileMsg('Excelを読むための部品を読み込めませんでした。通信状況を確認するか、CSVで保存して試してください。',true)});
  };
  fr.readAsArrayBuffer(file);
}

/* ---------- 出題の設定・分類の名前変更 ---------- */
// 設定を変えたとき、まだ1枚も答えていない・カードを出し切った（または今日の分がない）なら、新しい設定で作り直す。
// 学習の途中なら、途中のカードは消さずに次のセッションから反映する。
function refreshIfFinished(){
  var s=ui.session;
  if(s&&(s.i===0||s.queue.length===0||s.i>=s.queue.length)) ui.session=null;
}
function openRename(old){
  ui.renaming=old;
  openSheet('<form id="renForm" autocomplete="off" novalidate><h2>分類の名前を変更</h2>'+
   '<p class="note" style="margin:0;color:var(--muted);font-size:.88rem">すでにある分類と同じ名前にすると、2つの分類が1つにまとまります。</p>'+
   '<label>新しい名前<input id="r-name" type="text" maxlength="30" value="'+esc(old)+'"></label>'+
   '<p class="err" id="r-err" role="alert"></p>'+
   '<div class="sheet-actions"><button class="btn primary" type="submit">保存</button><button class="btn" type="button" data-act="close">キャンセル</button></div></form>');
}
function saveRename(){
  var old=ui.renaming,name=cleanCat($('#r-name').value);
  if(old==null) return;
  if(!name){$('#r-err').textContent='名前を入力してください。';return}
  // 大文字小文字だけの変更は、そのまま新しい名前にする
  var target=name.toLowerCase()===old.toLowerCase()?name:resolveCat(name);
  if(target===old){closeSheet();return}
  state.words.forEach(function(w){if(w.cat===old) w.cat=target});
  var i=state.cats.indexOf(old);
  if(i>=0&&state.cats.indexOf(target)<0) state.cats[i]=target;
  if(!Object.prototype.hasOwnProperty.call(prefs.mix,target)&&Object.prototype.hasOwnProperty.call(prefs.mix,old)) prefs.mix[target]=prefs.mix[old];
  delete prefs.mix[old];
  if(prefs.cat===old) prefs.cat=target;
  persist();closeSheet();resetSession();renderAll();toast('分類名を変更しました');
}

/* ---------- 書き出し・読み込み ---------- */
function runImport(){
  var raw=$('#imp').value,m=$('#impmsg'),a=raw.indexOf('{'),b=raw.lastIndexOf('}');
  try{
    if(a<0||b<a) throw new Error('x');
    var o=JSON.parse(raw.slice(a,b+1)),ws=cleanWords(o.words);
    if(!ws.length) throw new Error('x');
    state.words=ws;state.cats=normCats(ws,o.cats);
    // 古い書き出し（分類の割合を含まないもの）を読み込んだときは、今の設定を残す
    if(o.mix&&typeof o.mix==='object') prefs.mix=cleanMix(o.mix);
    if(o.perSession) prefs.perSession=cleanPer(o.perSession);
    persist();resetSession();renderAll();toast(ws.length+'語を読み込みました');
  }catch(e){m.textContent='読み込めませんでした。書き出したテキストを最初から最後まで貼り付けてください。';m.className='msg bad'}
}

/* ---------- イベント ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t) return;
  var a=t.dataset.act;
  if(a==='flip') flip();
  else if(a==='ok') grade(true);
  else if(a==='ng') grade(false);
  else if(a==='tab'){ui.view=t.dataset.v;showView()}
  else if(a==='cat'){prefs.cat=t.dataset.v;ui.forceAll=false;persist();resetSession();renderAll()}
  else if(a==='review'){prefs.review=!prefs.review;ui.forceAll=false;persist();resetSession();renderAll()}
  else if(a==='all'){ui.forceAll=true;resetSession();renderStudy()}
  else if(a==='today'){ui.forceAll=false;resetSession();renderStudy()}
  else if(a==='next'){resetSession();renderHeader();renderStudy()}
  else if(a==='add') openEdit(null);
  else if(a==='edit') openEdit(parseInt(t.dataset.no,10));
  else if(a==='selmode'){ui.sel=ui.sel?null:{};renderList()}
  else if(a==='pick'){var pn=parseInt(t.dataset.no,10);if(ui.sel){if(ui.sel[pn]) delete ui.sel[pn];else ui.sel[pn]=true;renderList()}}
  else if(a==='selall'){visibleWords().forEach(function(w){ui.sel[w.no]=true});renderList()}
  else if(a==='selclear'){ui.sel={};renderList()}
  else if(a==='selno') openSelNo();
  else if(a==='seldel'){var sc=selNos().length;if(sc) twice('sd',t,'もう一度押すと'+sc+'語を削除',deleteSelected)}
  else if(a==='bulk') openBulk();
  else if(a==='bulkrun') runBulk();
  else if(a==='pickfile') $('#bulkfile').click();
  else if(a==='close') closeSheet();
  else if(a==='del') twice('del',t,'もう一度押すと削除',function(){var w=byNo(ui.editing);if(w) state.words.splice(state.words.indexOf(w),1);persist();closeSheet();resetSession();renderAll();toast('削除しました')});
  else if(a==='copy') copyText($('#exp').value,$('#exp'));
  else if(a==='import') twice('imp',t,'もう一度押すと置き換え',runImport);
  else if(a==='theme'){prefs.theme=t.dataset.v;persist();applyTheme();$('#themeseg').innerHTML=themeBtns()}
  else if(a==='resetprog') twice('rp',t,'もう一度押すと進捗を消去',function(){state.words.forEach(function(w){w.box=0;w.due='';w.seen=0;w.ok=0;w.ng=0});persist();resetSession();renderAll();toast('進捗を消しました')});
  else if(a==='resetall') twice('ra',t,'もう一度押すと初期化',function(){state.words=seed();state.cats=DEFAULT_CATS.slice();prefs.mix=Object.assign({},DEFAULT_MIX);prefs.perSession=DEFAULT_PER_SESSION;persist();resetSession();renderAll();toast('最初の単語に戻しました')});
  else if(a==='rencat') openRename(t.dataset.cat);
  else if(a==='renum') twice('rn',t,'もう一度押すと振り直し',function(){state.words.sort(function(a,b){return a.no-b.no});state.words.forEach(function(w,i){w.no=i+1});persist();resetSession();renderAll();toast('No.を振り直しました')});
});
document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='editForm') saveEdit();else if(e.target.id==='renForm') saveRename();else if(e.target.id==='selNoForm') runSelNo()});
$('#q').addEventListener('input',renderList);
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='bulkfile'){var f=el.files&&el.files[0];readFile(f);el.value=''}
  else if(el.id==='f-cat'){var nw=$('#f-newwrap');if(nw){nw.hidden=el.value!=='__new';if(!nw.hidden)$('#f-newcat').focus()}}
  else if(el.id==='perses'){prefs.perSession=cleanPer(el.value);el.value=prefs.perSession;persist();refreshIfFinished()}
  else if(el.classList.contains('num')&&el.dataset.cat!=null){
    var v=parseInt(el.value,10);if(!(v>=0)) v=0;v=Math.min(99,v);
    prefs.mix[el.dataset.cat]=v;el.value=v;persist();refreshIfFinished();
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();return}
  if(ui.view!=='study'||!$('#sheet').hidden||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var s=ui.session;if(!s||s.i>=s.queue.length) return;
  if(e.key===' '||e.key==='Enter'){if(e.target.closest('button')) return;e.preventDefault();flip()}
  else if(e.key==='ArrowRight') grade(true);
  else if(e.key==='ArrowLeft') grade(false);
});

renderAll();
try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
})();
</script>
